[project]
name = "pcb"
version = "0.2.0"
description = "Emissivity repair and dynamic thermal inversion from PCB infrared image sequences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "torch>=2.3",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tdp-dynamic-inverse = "tdp.dynamic_inverse.cli:main"
tdp-web = "tdp.web.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "tqdm>=4.70.1",
]
